packages:
  - 'packages/@rsc-apps/*'
  - 'packages/@rsc-sage/*'
  - 'packages/@rsc-utils/*'

allowBuilds:
  '@parcel/watcher': true
  exifreader: true
  unrs-resolver: true
  zlib-sync: true

blockExoticSubdeps: false

# tasks:
#   build:
#     dependsOn:
#       - ^build # wait for dependency build tasks before building
#   test:
#     dependsOn:
#       - build # wait for build task before testing

overrides:
  "@types/node": "^24"
  "regex": "^6"
  "typescript": "^7"
  "vitest": "^4"

  "@rsc-utils/cache-utils": "../../@rsc-utils/cache-utils"
  "@rsc-utils/color-utils": "../../@rsc-utils/color-utils"
  "@rsc-utils/core-utils": "../../@rsc-utils/core-utils"
  "@rsc-utils/dev-scripts": "github:rpg-sage-creative/dev-scripts#semver:^1.6.1"
  "@rsc-utils/discord-utils": "../../@rsc-utils/discord-utils"
  "@rsc-utils/git-utils": "../../@rsc-utils/git-utils"
  "@rsc-utils/id-utils": "../../@rsc-utils/id-utils"
  "@rsc-utils/io-utils": "../../@rsc-utils/io-utils"
  "@rsc-utils/iterator-utils": "../../@rsc-utils/iterator-utils"
  "@rsc-utils/json-utils": "../../@rsc-utils/json-utils"
  "@rsc-utils/language-utils": "../../@rsc-utils/language-utils"
  "@rsc-utils/random-utils": "../../@rsc-utils/random-utils"
  "@rsc-utils/snowflake-utils": "../../@rsc-utils/snowflake-utils"
  "@rsc-utils/template-literal-utils": "../../@rsc-utils/template-literal-utils"
  "@rsc-utils/type-utils": "../../@rsc-utils/type-utils"
  "@rsc-utils/uuid-utils": "../../@rsc-utils/uuid-utils"
  "@rsc-utils/whitespace-utils": "../../@rsc-utils/whitespace-utils"

